name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "core[dev]" -e diff
      - run: ruff format --check core fixtures diff
      - run: ruff check core fixtures diff
      - run: pytest core diff

  # Plain install, no [dev]: fails if core accidentally imports cadquery.
  import-without-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e core
      - run: kyumi import fixtures/drone.step -o drone.kyumi
