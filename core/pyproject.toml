[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyumi"
version = "0.1.0"
description = "Turn a STEP file into a .kyumi package and view it"
requires-python = ">=3.11"
dependencies = ["cadquery-ocp==7.9.3.1.1", "numpy", "trimesh"]

[project.optional-dependencies]
# cadquery is only used by fixtures/make_fixtures.py; the importer needs just OCP.
dev = ["cadquery==2.8.0", "pytest", "ruff"]

[project.scripts]
kyumi = "kyumi.cli:main"

[tool.setuptools.packages.find]
include = ["kyumi*"]

[tool.setuptools.package-data]
kyumi = ["viewer.html"]
